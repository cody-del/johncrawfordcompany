# dist/ holds the readable source files. `npm run build` runs the checks, then copies dist/ to
# _site/ with every .css and .js file minified (scripts/minify-site.mjs); Netlify publishes _site/.
[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

# /api/lead sends the website's form leads to GoHighLevel. It needs the
# GHL_PRIVATE_TOKEN and GHL_LOCATION_ID environment variables.
# Repair photos additionally need GHL_REPAIR_PHOTO_FIELD_ID and forms.write on
# the same location token. The picker stays inactive until those are configured.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
